---
name: Unit tests
on:  # yamllint disable-line rule:truthy
  workflow_dispatch:
  push:
    branches:
      - main
      - v*
  pull_request:
    branches:
      - main
      - v*

jobs:
  unit-tests:
    name: Unit tests
    strategy:
      matrix:
        python_version: ["3.12", "3.13"]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/${{ github.repository }}:CI-${{ matrix.python_version }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.github_token }}
    steps:

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Sync dependencies (uv)
        run: uv sync --locked

      - name: Run unit tests
        run: uv run pytest -n auto -ra -v tests/unit
